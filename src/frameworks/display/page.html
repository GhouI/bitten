<!doctype html>
<html><head><meta charset="utf-8"><title>bitten</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #6b7a8f; overflow: hidden;
    font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  #status { position: fixed; right: 10px; bottom: 8px; color: #fff; opacity: .75; font-size: 12px; }
  .win { position: absolute; border-radius: 10px; overflow: hidden; background: #ececec;
    box-shadow: 0 12px 40px rgba(0,0,0,.35), 0 0 0 1px rgba(0,0,0,.25); }
  .bar { height: 28px; display: flex; align-items: center; justify-content: center; position: relative;
    background: linear-gradient(#ebebeb, #d6d6d6); border-bottom: 1px solid #b9b9b9;
    color: #333; cursor: default; user-select: none; }
  .dots { position: absolute; left: 10px; top: 8px; display: flex; gap: 8px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot.close { background: #ff5f57; } .dot.min { background: #febc2e; } .dot.max { background: #28c840; }
  canvas { display: block; outline: none; }
</style></head>
<body><div id="status">connecting...</div>
<script>
"use strict";
// bitten's display: every window of the Mac program, drawn from the
// frames mrun sends, with mouse and keyboard input sent back.
const wins = new Map(); let focused = 0; let z = 1; let ws;
const status = document.getElementById("status");
const KEYS = {KeyA:0,KeyS:1,KeyD:2,KeyF:3,KeyH:4,KeyG:5,KeyZ:6,KeyX:7,KeyC:8,KeyV:9,KeyB:11,KeyQ:12,
  KeyW:13,KeyE:14,KeyR:15,KeyY:16,KeyT:17,Digit1:18,Digit2:19,Digit3:20,Digit4:21,Digit6:22,Digit5:23,
  Equal:24,Digit9:25,Digit7:26,Minus:27,Digit8:28,Digit0:29,BracketRight:30,KeyO:31,KeyU:32,BracketLeft:33,
  KeyI:34,KeyP:35,Enter:36,KeyL:37,KeyJ:38,Quote:39,KeyK:40,Semicolon:41,Backslash:42,Comma:43,Slash:44,
  KeyN:45,KeyM:46,Period:47,Tab:48,Space:49,Backquote:50,Backspace:51,Escape:53,MetaRight:54,MetaLeft:55,
  ShiftLeft:56,CapsLock:57,AltLeft:58,ControlLeft:59,ShiftRight:60,AltRight:61,ControlRight:62,
  NumpadDecimal:65,NumpadMultiply:67,NumpadAdd:69,NumLock:71,NumpadDivide:75,NumpadEnter:76,
  NumpadSubtract:78,NumpadEqual:81,Numpad0:82,Numpad1:83,Numpad2:84,Numpad3:85,Numpad4:86,Numpad5:87,
  Numpad6:88,Numpad7:89,Numpad8:91,Numpad9:92,F5:96,F6:97,F7:98,F3:99,F8:100,F9:101,F11:103,F10:109,
  F12:111,Insert:114,Home:115,PageUp:116,Delete:117,F4:118,End:119,F2:120,PageDown:121,F1:122,
  ArrowLeft:123,ArrowRight:124,ArrowDown:125,ArrowUp:126};
// Characters AppKit expects for keys that have no printable character.
const SPECIAL = {Enter:"\r",NumpadEnter:"\u0003",Tab:"\t",Backspace:"\u007f",Escape:"\u001b",
  ArrowUp:"",ArrowDown:"",ArrowLeft:"",ArrowRight:"",Delete:"",
  Home:"",End:"",PageUp:"",PageDown:"",F1:"",F2:"",F3:"",
  F4:"",F5:"",F6:"",F7:"",F8:"",F9:"",F10:"",F11:"",F12:""};
function mods(e) {  // NSEventModifierFlags
  return (e.getModifierState && e.getModifierState("CapsLock") ? 1<<16 : 0) | (e.shiftKey ? 1<<17 : 0) |
    (e.ctrlKey ? 1<<18 : 0) | (e.altKey ? 1<<19 : 0) | (e.metaKey ? 1<<20 : 0);
}
function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }
function focus(id) { focused = id; const w = wins.get(id); if (w) w.el.style.zIndex = ++z; }
function makeWindow(id) {
  const el = document.createElement("div"); el.className = "win";
  const bar = document.createElement("div"); bar.className = "bar";
  bar.innerHTML = '<div class="dots"><div class="dot close"></div><div class="dot min"></div><div class="dot max"></div></div><span></span>';
  const canvas = document.createElement("canvas"); canvas.tabIndex = 0;
  el.append(bar, canvas); document.body.append(el);
  const w = {el, bar, canvas, ctx: canvas.getContext("2d"), title: bar.querySelector("span"), buttons: 0, moved: false};
  bar.querySelector(".close").onclick = () => send({t: "close", w: id});
  // Dragging the title bar moves the window on the page only.
  bar.onpointerdown = (e) => {
    if (e.target.classList.contains("dot")) return;
    focus(id); w.moved = true;
    const sx = e.clientX - el.offsetLeft, sy = e.clientY - el.offsetTop;
    const move = (m) => { el.style.left = (m.clientX - sx) + "px"; el.style.top = (m.clientY - sy) + "px"; };
    const up = () => { removeEventListener("pointermove", move); removeEventListener("pointerup", up); };
    addEventListener("pointermove", move); addEventListener("pointerup", up);
  };
  const at = (e) => { const r = canvas.getBoundingClientRect();
    return {x: (e.clientX - r.left) * canvas.width / r.width, y: (e.clientY - r.top) * canvas.height / r.height}; };
  canvas.onpointerdown = (e) => { focus(id); canvas.focus(); canvas.setPointerCapture(e.pointerId);
    w.buttons |= 1 << e.button; const p = at(e); send({t: "down", w: id, x: p.x, y: p.y, b: e.button, m: mods(e)}); e.preventDefault(); };
  canvas.onpointerup = (e) => { w.buttons &= ~(1 << e.button); const p = at(e);
    send({t: "up", w: id, x: p.x, y: p.y, b: e.button, m: mods(e)}); };
  canvas.onpointermove = (e) => { const p = at(e);
    send({t: w.buttons ? "drag" : "move", w: id, x: p.x, y: p.y, b: Math.log2(w.buttons || 1) | 0, m: mods(e)}); };
  canvas.oncontextmenu = (e) => e.preventDefault();
  canvas.onwheel = (e) => { const p = at(e); const k = e.deltaMode === 1 ? 16 : 1;
    send({t: "scroll", w: id, x: p.x, y: p.y, dx: -e.deltaX * k, dy: -e.deltaY * k, m: mods(e)}); e.preventDefault(); };
  wins.set(id, w); return w;
}
function key(e, type) {
  if (!focused) return;
  const code = KEYS[e.code]; if (code === undefined) return;
  let c = SPECIAL[e.code] || (e.key.length === 1 ? e.key : "");
  if (e.ctrlKey && c.length === 1 && /[a-z]/i.test(c)) c = String.fromCharCode(c.toLowerCase().charCodeAt(0) - 96);
  send({t: type, w: focused, k: code, c, m: mods(e)});
  if (!(e.key === "F5" || (e.ctrlKey && e.key === "r"))) e.preventDefault();
}
addEventListener("keydown", (e) => key(e, "key"));
addEventListener("keyup", (e) => key(e, "keyup"));
function frame(buf) {
  const v = new DataView(buf); const type = v.getUint8(0), id = v.getUint32(1, true);
  if (type === 2) { const w = wins.get(id); if (w) { w.el.remove(); wins.delete(id); } return; }
  const x = v.getInt32(5, true), y = v.getInt32(9, true), width = v.getUint32(13, true), height = v.getUint32(17, true);
  const tl = v.getUint16(21, true), title = new TextDecoder().decode(new Uint8Array(buf, 23, tl));
  const w = wins.get(id) || makeWindow(id);
  if (!w.moved) { w.el.style.left = x + "px"; w.el.style.top = y + "px"; }
  w.title.textContent = title; document.title = title || "bitten";
  if (w.canvas.width !== width || w.canvas.height !== height) { w.canvas.width = width; w.canvas.height = height; }
  if (width && height) w.ctx.putImageData(new ImageData(new Uint8ClampedArray(buf, 23 + tl, width * height * 4), width, height), 0, 0);
  if (!focused) focus(id);
}
function connect() {
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
  ws.binaryType = "arraybuffer";
  ws.onopen = () => { status.textContent = "connected"; };
  ws.onmessage = (m) => { if (typeof m.data !== "string") frame(m.data); };
  ws.onclose = () => { status.textContent = "disconnected; retrying"; setTimeout(connect, 1000); };
}
connect();
</script></body></html>
