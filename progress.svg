<svg xmlns="http://www.w3.org/2000/svg" width="480" height="240" viewBox="0 0 480 240">
<style>
  text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .bg { fill: #ffffff; } .ink { fill: #1f2328; } .mute { fill: #656d76; }
  .track { stroke: #eaeef2; } .done { stroke: #2da44e; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; } .ink { fill: #e6edf3; } .mute { fill: #8d96a0; }
    .track { stroke: #21262d; } .done { stroke: #3fb950; }
  }
</style>
<rect width="480" height="240" rx="12" class="bg"/>
<circle cx="120" cy="120" r="80" fill="none" class="track" stroke-width="22"/>
<circle cx="120" cy="120" r="80" fill="none" class="done" stroke-width="22" stroke-linecap="round" stroke-dasharray="195.3 502.7" transform="rotate(-90 120 120)"/>
<text x="120" y="133" text-anchor="middle" class="ink" font-size="38" font-weight="700">39%</text>
<text x="250" y="105" class="ink" font-size="20" font-weight="600">Mac app support</text>
<text x="250" y="135" class="mute" font-size="15">2,324 of 5,982 functions</text>
<text x="250" y="158" class="mute" font-size="15">implemented</text>
<text x="250" y="190" class="mute" font-size="12">updated 2026-11-25</text>
</svg>
