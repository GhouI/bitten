# The target app's terminal from App.dmg, in a container, no VM.
#
#   APP_DMG=/path/to/App.dmg APPCLI=<the app's CLI> docker compose -f examples/mac-terminal/compose.yaml up
#   then open http://localhost:7680
#
# The app's server and CLI are the unmodified macOS binaries from your disk
# image. The page is bitten's own viewer: the app's SwiftUI window does not run
# yet (see docs/TARGET-APP.md).
services:
  terminal:
    build: ../..
    image: bitten
    environment:
      APPCLI: "${APPCLI:?set APPCLI to the name of the app's command-line program}"
    command: ["shell", "-c", "exec python3 /usr/share/bitten/examples/mac-terminal/terminal.py"]
    volumes:
      - "${APP_DMG:?set APP_DMG to the path of your App.dmg}:/dmg/app.dmg:ro"
      - app-home:/Users/mac
    ports:
      # localhost only: the page types into a shell and has no login
      - "127.0.0.1:7680:7680"
    init: true
volumes:
  app-home:
